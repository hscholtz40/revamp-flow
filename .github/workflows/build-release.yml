name: Build Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.3.0)'
        required: true
        default: 'v2.0.3' 
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git SHA

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring, xml, ctype, json, fileinfo, pdo, pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Frontend Assets
        run: npm run build

      - name: Typecheck Frontend
        run: npm run typecheck

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v2.0.3" 
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Get Short SHA
        id: sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Short SHA: $SHORT_SHA"

      - name: Create Release Package
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.sha.outputs.sha }}"
          NAME="jobcardonline-${VERSION}-${SHORT_SHA}"
          STAGING_DIR="dist/${NAME}"
          
          # Create staging directory
          mkdir -p "$STAGING_DIR"
          
          # Copy files, excluding dev directories
          rsync -av \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='.idea' \
            --exclude='.vscode' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='.env' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='phpunit.xml' \
            --exclude='.phpunit.result.cache' \
            --exclude='.phpunit.cache' \
            ./ "$STAGING_DIR/"
          
          # Create .env file with generated APP_KEY for deployment
          # NOTE: This creates a template .env file. Update it with your actual values on the server!
          echo "Creating .env file with generated APP_KEY..."
          
          # Generate APP_KEY using PHP
          APP_KEY=$(php -r "echo 'base64:'.base64_encode(random_bytes(32));")
          
          # Create .env file template with APP_KEY
          {
            echo 'APP_NAME="JobCard Online"'
            echo 'APP_ENV=production'
            echo "APP_KEY=${APP_KEY}"
            echo 'APP_DEBUG=false'
            echo 'APP_URL=http://localhost'
            echo ''
            echo 'LOG_CHANNEL=stack'
            echo 'LOG_DEPRECATIONS_CHANNEL=null'
            echo 'LOG_LEVEL=debug'
            echo ''
            echo 'DB_CONNECTION=mysql'
            echo 'DB_HOST=127.0.0.1'
            echo 'DB_PORT=3306'
            echo 'DB_DATABASE=laravel'
            echo 'DB_USERNAME=root'
            echo 'DB_PASSWORD='
            echo ''
            echo 'BROADCAST_DRIVER=log'
            echo 'CACHE_STORE=array'
            echo 'FILESYSTEM_DISK=local'
            echo 'QUEUE_CONNECTION=sync'
            echo 'SESSION_DRIVER=file'
            echo 'SESSION_LIFETIME=120'
            echo ''
            echo 'MEMCACHED_HOST=127.0.0.1'
            echo ''
            echo 'REDIS_HOST=127.0.0.1'
            echo 'REDIS_PASSWORD=null'
            echo 'REDIS_PORT=6379'
            echo ''
            echo 'MAIL_MAILER=smtp'
            echo 'MAIL_HOST=mailpit'
            echo 'MAIL_PORT=1025'
            echo 'MAIL_USERNAME=null'
            echo 'MAIL_PASSWORD=null'
            echo 'MAIL_ENCRYPTION=null'
            echo 'MAIL_FROM_ADDRESS="hello@example.com"'
            echo 'MAIL_FROM_NAME="${APP_NAME}"'
            echo ''
            echo 'AWS_ACCESS_KEY_ID='
            echo 'AWS_SECRET_ACCESS_KEY='
            echo 'AWS_DEFAULT_REGION=us-east-1'
            echo 'AWS_BUCKET='
            echo 'AWS_USE_PATH_STYLE_ENDPOINT=false'
            echo ''
            echo 'VITE_APP_NAME="${APP_NAME}"'
            echo ''
            echo 'FCM_CREDENTIALS_PATH='
            echo 'APNS_KEY_ID='
            echo 'APNS_TEAM_ID='
            echo 'APNS_APP_BUNDLE_ID='
            echo 'APNS_PRIVATE_KEY='
            echo 'APNS_USE_SANDBOX=false'
          } > "$STAGING_DIR/.env"
          
          echo "Created .env file with APP_KEY: ${APP_KEY:0:20}..."
          
          # Also create .env.example without APP_KEY for reference
          if [ ! -f "$STAGING_DIR/.env.example" ]; then
            {
              echo 'APP_NAME="JobCard Online"'
              echo 'APP_ENV=production'
              echo 'APP_KEY='
              echo 'APP_DEBUG=false'
              echo 'APP_URL=http://localhost'
              echo ''
              echo 'LOG_CHANNEL=stack'
              echo 'LOG_DEPRECATIONS_CHANNEL=null'
              echo 'LOG_LEVEL=debug'
              echo ''
              echo 'DB_CONNECTION=mysql'
              echo 'DB_HOST=127.0.0.1'
              echo 'DB_PORT=3306'
              echo 'DB_DATABASE=laravel'
              echo 'DB_USERNAME=root'
              echo 'DB_PASSWORD='
              echo ''
              echo 'BROADCAST_DRIVER=log'
              echo 'CACHE_STORE=array'
              echo 'FILESYSTEM_DISK=local'
              echo 'QUEUE_CONNECTION=sync'
              echo 'SESSION_DRIVER=file'
              echo 'SESSION_LIFETIME=120'
              echo ''
              echo 'MEMCACHED_HOST=127.0.0.1'
              echo ''
              echo 'REDIS_HOST=127.0.0.1'
              echo 'REDIS_PASSWORD=null'
              echo 'REDIS_PORT=6379'
              echo ''
              echo 'MAIL_MAILER=smtp'
              echo 'MAIL_HOST=mailpit'
              echo 'MAIL_PORT=1025'
              echo 'MAIL_USERNAME=null'
              echo 'MAIL_PASSWORD=null'
              echo 'MAIL_ENCRYPTION=null'
              echo 'MAIL_FROM_ADDRESS="hello@example.com"'
              echo 'MAIL_FROM_NAME="${APP_NAME}"'
              echo ''
              echo 'AWS_ACCESS_KEY_ID='
              echo 'AWS_SECRET_ACCESS_KEY='
              echo 'AWS_DEFAULT_REGION=us-east-1'
              echo 'AWS_BUCKET='
              echo 'AWS_USE_PATH_STYLE_ENDPOINT=false'
              echo ''
              echo 'VITE_APP_NAME="${APP_NAME}"'
            } > "$STAGING_DIR/.env.example"
            echo "Created .env.example template"
          fi
          
          # Create required storage directories (even if empty, they need to exist)
          # These directories are excluded from rsync but must exist for Laravel to work
          mkdir -p "$STAGING_DIR/storage/app/public"
          mkdir -p "$STAGING_DIR/storage/framework/cache/data"
          mkdir -p "$STAGING_DIR/storage/framework/sessions"
          mkdir -p "$STAGING_DIR/storage/framework/testing"
          mkdir -p "$STAGING_DIR/storage/framework/views"
          mkdir -p "$STAGING_DIR/storage/logs"
          mkdir -p "$STAGING_DIR/storage/fonts"
          mkdir -p "$STAGING_DIR/bootstrap/cache"

          FCM_CREDENTIALS_FILE="storage/app/revampjobcard-8f5fb37b5d39.json"
          if [ -f "$FCM_CREDENTIALS_FILE" ]; then
            cp "$FCM_CREDENTIALS_FILE" "$STAGING_DIR/storage/app/"
            echo "Included Firebase credentials: $FCM_CREDENTIALS_FILE"
          else
            echo "Warning: $FCM_CREDENTIALS_FILE not found; Android push will not work until it is added to the package."
          fi
          
          # Copy .gitignore files to preserve directory structure (rsync excludes .gitignore)
          # These ensure empty directories are tracked in git and preserved in deployment
          if [ -f "storage/framework/cache/.gitignore" ]; then
            cp storage/framework/cache/.gitignore "$STAGING_DIR/storage/framework/cache/.gitignore"
          fi
          if [ -f "storage/framework/cache/data/.gitignore" ]; then
            cp storage/framework/cache/data/.gitignore "$STAGING_DIR/storage/framework/cache/data/.gitignore"
          fi
          if [ -f "storage/framework/sessions/.gitignore" ]; then
            cp storage/framework/sessions/.gitignore "$STAGING_DIR/storage/framework/sessions/.gitignore"
          fi
          if [ -f "storage/framework/views/.gitignore" ]; then
            cp storage/framework/views/.gitignore "$STAGING_DIR/storage/framework/views/.gitignore"
          fi
          if [ -f "storage/logs/.gitignore" ]; then
            cp storage/logs/.gitignore "$STAGING_DIR/storage/logs/.gitignore"
          fi
          if [ -f "bootstrap/cache/.gitignore" ]; then
            cp bootstrap/cache/.gitignore "$STAGING_DIR/bootstrap/cache/.gitignore"
          fi
          
          # Create zip file
          cd dist
          zip -r "${NAME}.zip" "$NAME"
          cd ..
          
          echo "package_name=${NAME}.zip" >> $GITHUB_OUTPUT
          echo "package_path=dist/${NAME}.zip" >> $GITHUB_OUTPUT
          echo "Created package: dist/${NAME}.zip"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ steps.version.outputs.version }}-${{ steps.sha.outputs.sha }}
          path: ${{ steps.package.outputs.package_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.package.outputs.package_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


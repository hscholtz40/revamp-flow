name: Build Release Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.3.0)'
        required: true
        default: 'v1.3.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git SHA

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring, xml, ctype, json, fileinfo, pdo, pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v1.3.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Get Short SHA
        id: sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Short SHA: $SHORT_SHA"

      - name: Create Release Package
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.sha.outputs.sha }}"
          NAME="jobcardonline-${VERSION}-${SHORT_SHA}"
          STAGING_DIR="dist/${NAME}"
          
          # Create staging directory
          mkdir -p "$STAGING_DIR"
          
          # Copy files, excluding dev directories
          rsync -av \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='.idea' \
            --exclude='.vscode' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='.env' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='phpunit.xml' \
            --exclude='.phpunit.result.cache' \
            --exclude='.phpunit.cache' \
            ./ "$STAGING_DIR/"
          
          # Remove .env if it exists (keep .env.example for deployment)
          rm -f "$STAGING_DIR/.env"
          
          # Create zip file
          cd dist
          zip -r "${NAME}.zip" "$NAME"
          cd ..
          
          echo "package_name=${NAME}.zip" >> $GITHUB_OUTPUT
          echo "package_path=dist/${NAME}.zip" >> $GITHUB_OUTPUT
          echo "Created package: dist/${NAME}.zip"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ steps.version.outputs.version }}-${{ steps.sha.outputs.sha }}
          path: ${{ steps.package.outputs.package_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.package.outputs.package_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


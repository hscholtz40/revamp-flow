name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: xdebug
          extensions: mbstring, xml, ctype, json, fileinfo, pdo, pdo_mysql

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Environment File
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            # Create minimal .env file for testing with MySQL
            cat > .env << EOF
          APP_NAME="JobCard Online"
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=laravel_test
          DB_USERNAME=root
          DB_PASSWORD=
          
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          EOF
          fi

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Clear Configuration Cache
        run: php artisan config:clear

      - name: Create Test Database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -e "CREATE DATABASE IF NOT EXISTS laravel_test;"

      - name: Build Assets
        run: npm run build

      - name: Typecheck Frontend
        run: npm run typecheck

      - name: Run Backend Coverage
        run: composer test:coverage

      - name: Run Frontend Coverage
        run: npm run test:frontend:coverage

      - name: Summarize Coverage
        run: |
          php -r '$xml = simplexml_load_file("storage/coverage/backend/clover.xml"); $rate = round(((float) $xml->project["line-rate"]) * 100, 2); file_put_contents(getenv("GITHUB_STEP_SUMMARY"), "## Coverage Summary\n\n- Backend line coverage: {$rate}%\n", FILE_APPEND);'
          node -e "const fs=require('fs'); const summary=JSON.parse(fs.readFileSync('storage/coverage/frontend/coverage-summary.json','utf8')); const total=summary.total; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- Frontend lines: ${total.lines.pct}%\n- Frontend functions: ${total.functions.pct}%\n- Frontend branches: ${total.branches.pct}%\n- Frontend statements: ${total.statements.pct}%\n`);"

      - name: Upload Backend Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: storage/coverage/backend

      - name: Upload Frontend Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: storage/coverage/frontend

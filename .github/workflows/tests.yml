name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MySQL
        uses: actions/setup-mysql@v4
        with:
          mysql-version: '8.0'
          mysql-root-password: ''

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug
          extensions: mbstring, xml, ctype, json, fileinfo, pdo, pdo_mysql

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          # Try npm ci first, fallback to npm install if lock file is out of sync
          if ! npm ci --legacy-peer-deps 2>/dev/null; then
            echo "Lock file out of sync, using npm install"
            npm install --legacy-peer-deps
          fi

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Environment File
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            # Create minimal .env file for testing with MySQL
            cat > .env << EOF
          APP_NAME="JobCard Online"
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=laravel_test
          DB_USERNAME=root
          DB_PASSWORD=
          
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          EOF
          fi

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Clear Configuration Cache
        run: php artisan config:clear

      - name: Create Test Database
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS laravel_test;"

      - name: Build Assets
        run: npm run build

      - name: Run Tests
        run: ./vendor/bin/pest
